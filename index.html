<!doctype html>
<html lang="en">
<head>
<title>InSeason Demo</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Phone-width app, centered on larger screens. One committed light look (market green + cream). */
:root{
  --green:#2F5D3A; --green-dk:#22402A; --tomato:#C8442E; --gold:#E0A526;
  --cream:#FBF6EC; --paper:#FFFBF3; --line:#E8DCC4; --line2:#D8C9AE;
  --brown:#5B4A3A; --muted:#6B5B4B; --ink:#2A2A22; --ground:#E8E1D2;
  --ok-bg:#E3EFDF; --low-bg:#FBEFC9; --low-ink:#7A5A00; --out-bg:#ECEAE5; --out-ink:#77736B;
  --display:'Fraunces',Georgia,serif; --body:'DM Sans',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:96px;box-shadow:0 0 30px rgba(60,40,20,.12)}
h1,h2,h3{font-family:var(--display);color:var(--green-dk);margin:0;text-wrap:balance}
.pad{padding-left:16px;padding-right:16px}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.b{font-weight:700}
.sec-title{font-family:var(--display);font-size:20px;font-weight:600;color:var(--green-dk)}
.sample{background:var(--green-dk);color:#E8DCC4;font-size:11px;text-align:center;padding:4px;letter-spacing:.3px}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:var(--cream);padding:12px 16px 10px;border-bottom:1px solid transparent}
.brand{font-family:var(--display);font-size:26px;font-weight:700;color:var(--green-dk);letter-spacing:-.5px}
.iconbtn{width:44px;height:44px;border:none;background:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:0}
.back{display:inline-flex;align-items:center;gap:2px;height:44px;border:none;background:none;font-weight:700;color:var(--green);padding:0 6px 0 0}

/* Market header */
.mkt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:8px;padding:10px 12px;background:#fff;border:1.5px solid var(--line);border-radius:14px}
.open{color:var(--green);font-weight:700}
.next{color:var(--brown)}

/* Search */
.search{display:flex;align-items:center;gap:8px;height:48px;margin-top:10px;padding:0 12px;background:#fff;border:1.5px solid var(--line2);border-radius:14px}
.search input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:16px}
.clear{border:none;background:var(--line);border-radius:12px;height:28px;padding:0 10px;font-size:13px;font-weight:700}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line2);background:#fff;font-size:14px;white-space:nowrap}
.chip.on{background:var(--green);border-color:var(--green);color:var(--paper);font-weight:700}
.chip.ebt.on{background:var(--gold);border-color:var(--gold);color:var(--green-dk)}
.season{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;border:none;background:none;padding:0;font-size:12px;text-align:center}
.season .dot{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--line)}

/* Favorites row */
.favs{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.fav{flex-shrink:0;width:150px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px}
.empty{margin:4px 16px 10px;padding:12px 14px;border:1.5px dashed var(--line2);border-radius:14px;font-size:14px;color:var(--brown)}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:700;white-space:nowrap}
.st-here{background:var(--green);color:var(--paper)}
.st-not{background:var(--out-bg);color:var(--out-ink)}
.st-unc{border:1.5px dashed var(--gold);color:var(--low-ink);background:#FFF8E6}
.stock{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.stock::before{content:"";width:8px;height:8px;border-radius:4px;background:currentColor}
.s-plenty{background:var(--ok-bg);color:var(--green)}
.s-low{background:var(--low-bg);color:var(--low-ink)}
.s-sold{background:var(--out-bg);color:var(--out-ink)}
.strike{text-decoration:line-through;color:var(--out-ink)}

/* Vendor card */
.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.card.away{background:#F6F1E6}
.card.away .photo{filter:grayscale(.7);opacity:.55}
.card-hit{display:block;width:100%;text-align:left;border:none;background:none;padding:0}
.avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--paper)}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.pay{display:flex;flex-wrap:wrap;gap:6px}
.paytag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:8px;background:var(--cream);border:1px solid var(--line);font-size:12px;font-weight:500}
.paytag.ebt{background:#FFF3D6;border-color:#EBCB7A}
.cashonly{background:var(--tomato);color:var(--paper);border-color:var(--tomato);font-weight:700}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--green);background:#fff;color:var(--green);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.solid{background:var(--green);color:var(--paper)}
.btn.big{height:56px;font-size:17px;border-radius:16px;width:100%}
.btn.tomato{background:var(--tomato);border-color:var(--tomato);color:var(--paper)}
.btn.ghost{border-color:var(--line2);color:var(--brown)}
.follow.on{background:#fff;color:var(--green)}
.follow{background:var(--green);color:var(--paper)}

/* Simple view */
.simple .srow{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:17px;display:block;width:100%;text-align:left}
.simple .srow.away{background:#F6F1E6;color:var(--out-ink)}

/* Sections */
.box{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px}
.soon{display:inline-flex;height:22px;align-items:center;padding:0 8px;border-radius:11px;background:#EFE6D3;color:var(--brown);font-size:11px;font-weight:700;letter-spacing:.3px}

/* Bottom nav */
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:30;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;min-height:44px;font-size:11px;color:var(--muted)}
nav.tabs button.on{color:var(--green);font-weight:700}

/* Sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(34,30,20,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:430px;background:var(--paper);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.field{width:100%;height:52px;border:1.5px solid var(--line2);border-radius:14px;padding:0 14px;font-size:16px;background:#fff}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:60;background:var(--green-dk);color:var(--paper);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;max-width:360px;width:calc(100% - 40px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* Toggle */
.tog{width:52px;height:32px;border-radius:16px;border:none;background:#CFC6B4;position:relative;flex-shrink:0;padding:0}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:left .15s}
.tog.on{background:var(--green)}
.tog.on::after{left:23px}

/* Vendor side */
.vbtn3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vseg{height:56px;border-radius:14px;border:2px solid var(--line2);background:#fff;font-weight:700;font-size:15px}
.vseg.on.plenty{background:var(--green);border-color:var(--green);color:var(--paper)}
.vseg.on.low{background:var(--gold);border-color:var(--gold);color:var(--green-dk)}
.vseg.on.sold{background:#77736B;border-color:#77736B;color:#fff}
.yesno{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn{height:64px;border-radius:16px;border:2px solid var(--line2);background:#fff;font-weight:700;font-size:16px}
.yn.on.yes{background:var(--green);border-color:var(--green);color:var(--paper)}
.yn.on.no{background:var(--tomato);border-color:var(--tomato);color:var(--paper)}

/* Map */
.mapwrap{background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
@keyframes pulse{0%{r:20}50%{r:26}100%{r:20}}
@media (prefers-reduced-motion:reduce){.tog::after{transition:none}}
</style>
</head>
<body>

<div id="app"></div>
<div id="layer"></div>

<script>
(function(){
/* ---------- Data ---------- */
var MARKETS = [
  {id:'downtown', name:'Santa Barbara Downtown', short:'Downtown', day:6, open:[8,0], close:[13,0], where:'State St & Carrillo St', street:'State Street'},
  {id:'goleta', name:'Goleta', short:'Goleta', day:0, open:[10,0], close:[14,0], where:'Camino Real Marketplace', street:'Marketplace Drive'},
  {id:'montecito', name:'Montecito', short:'Montecito', day:5, open:[8,0], close:[11,15], where:'Coast Village Road', street:'Coast Village Road'},
  {id:'carpinteria', name:'Carpinteria', short:'Carpinteria', day:4, open:[14,30], close:[18,0], where:'Linden Avenue', street:'Linden Avenue'}
];
var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var PAY = {cash:'Cash', card:'Card', mobile:'Apple Pay / Venmo', ebt:'EBT/CalFresh', tokens:'Market tokens'};
var CATS = ['All','Produce','Fruit','Eggs & Dairy','Bakery','Flowers','Prepared Food'];
var SEASON = [
  {label:'Persimmons', q:'persimmon', c:'#E8833A'},
  {label:'Mandarins', q:'mandarin', c:'#F2A33A'},
  {label:'Winter squash', q:'squash', c:'#D9A441'},
  {label:'Apples', q:'apple', c:'#C8442E'},
  {label:'Kale', q:'kale', c:'#5E8C55'},
  {label:'Avocados', q:'avocado', c:'#6E8B3D'}
];

function V(id,name,cat,from,col,sign,markets,booth,pay,items,about,since,reviews){
  return {id:id,name:name,cat:cat,from:from,col:col,sign:sign,markets:markets,booth:booth,pay:pay,items:items,about:about,since:since,reviews:reviews||[]};
}
function I(name,price,stock,on){return {name:name,price:price,stock:stock,on:on!==false};}

var SEED_VENDORS = [
  V('sunny-slope','Sunny Slope Berries','Fruit','Carpinteria',{sky:'#F6E3B4',aw:'#C8442E',p:['#D9472F','#9C2F45','#3E5C9A']},'BERRIES',['downtown','carpinteria'],{downtown:12,carpinteria:4},['cash','card','mobile','ebt','tokens'],
    [I('Strawberries','$5 / basket','low'),I('Raspberries','$6 / basket','plenty'),I('Blueberries','$7 / pint','sold'),I('Strawberry jam','$9 / jar','plenty'),I('Blackberries','$6 / basket','plenty',false)],
    "We're a third-generation family farm in the Carpinteria foothills. We pick the day before market and make our jam in small batches on the farm.",1998,
    [{s:5,t:'Best strawberries at the market. Worth getting there early.',w:'Maria G.'},{s:5,t:'Super friendly and they always tell you what is sweetest that week.',w:'Dan K.'}]),
  V('mesa-hen','Mesa Hen & Goat Farm','Eggs & Dairy','Santa Ynez',{sky:'#DDE5C0',aw:'#E0A526',p:['#F2E6C9','#C9A27A','#F7F1E3']},'FRESH EGGS',['downtown','montecito'],{downtown:8,montecito:3},['cash','card','ebt'],
    [I('Pasture-raised eggs','$8 / dozen','plenty'),I('Goat cheese','$10','low'),I('Duck eggs','$10 / dozen','plenty')],
    'Our hens and goats live outside on 20 acres in the Santa Ynez Valley. Eggs are collected every morning.',2009,
    [{s:5,t:'The goat cheese sells out fast for a reason.',w:'Priya S.'}]),
  V('hilltop','Hilltop Bread Co.','Bakery','Goleta',{sky:'#EFE6D3',aw:'#7E4F2D',p:['#C08A4E','#D9A86C','#A0693F']},'BAKERY',['downtown','goleta'],{downtown:7,goleta:2},['cash','card','mobile'],
    [I('Sourdough loaf','$9','plenty'),I('Baguette','$5','plenty'),I('Croissants','$4.50 each','low')],
    'Naturally leavened bread baked overnight in Goleta with California-grown flour.',2015,
    [{s:5,t:'Their sourdough is the reason I go on Saturdays.',w:'Alex R.'}]),
  V('rincon','Rincon Flower Farm','Flowers','Ventura',{sky:'#F3D3C6',aw:'#5E8C55',p:['#D96BA0','#EFC94C','#E35A3F']},'FLOWERS',['downtown','carpinteria'],{downtown:15,carpinteria:6},['cash','card','mobile'],
    [I('Dahlias','$15 / bunch','low'),I('Sunflowers','$12 / bunch','plenty'),I('Mixed bouquet','$20','plenty')],
    'Cut flowers grown near Rincon Point. Bouquets are made the morning of market.',2012,
    [{s:5,t:'Bouquets last well over a week.',w:'Jen T.'}]),
  V('ellwood','Ellwood Greens','Produce','Goleta',{sky:'#DDE5C0',aw:'#3F6B45',p:['#5E8C55','#4B2E5C','#D9A441']},'VEGGIES',['downtown','goleta'],{downtown:19,goleta:5},['cash'],
    [I('Japanese eggplant','$4 / lb','low'),I('Kale','$3 / bunch','plenty'),I('Butternut squash','$2.50 / lb','plenty'),I('Delicata squash','$3 / lb','sold')],
    'Small vegetable farm on the Goleta coast. Everything is grown without synthetic sprays.',2017,
    [{s:4,t:'Great eggplant. Bring cash!',w:'Sam L.'}]),
  V('topa','Topa Mountain Citrus','Fruit','Ojai',{sky:'#F6E3B4',aw:'#E0A526',p:['#F2A33A','#F2D466','#E8833A']},'CITRUS',['downtown','montecito'],{downtown:10,montecito:5},['cash','card','ebt','tokens'],
    [I('Satsuma mandarins','$4 / lb','plenty'),I('Meyer lemons','$3 / lb','plenty'),I('Fuyu persimmons','$3.50 / lb','low')],
    'Citrus and persimmons from the hills above Ojai. November is our favorite month.',2004,
    [{s:5,t:'The satsumas are like candy right now.',w:'Chris M.'}]),
  V('high-valley','High Valley Orchard','Fruit','Cuyama Valley',{sky:'#EFE6D3',aw:'#C8442E',p:['#C8442E','#D9C54A','#8FB04A']},'APPLES',['downtown','goleta'],{downtown:21,goleta:7},['cash','card','ebt'],
    [I('Fuji apples','$3 / lb','plenty'),I('Asian pears','$4 / lb','plenty'),I('Apple cider','$8 / half gallon','plenty')],
    'Apples and pears from 3,000 feet up in the Cuyama Valley.',2001,[]),
  V('mission-tamales','Mission Street Tamales','Prepared Food','Santa Barbara',{sky:'#F3D3C6',aw:'#7E4F2D',p:['#E9C46A','#C8442E','#5E8C55']},'TAMALES',['downtown','carpinteria'],{downtown:23,carpinteria:9},['cash','card','mobile'],
    [I('Pork tamales','$4 each','plenty'),I('Veggie tamales','$4 each','plenty'),I('Salsa verde','$8 / jar','low')],
    'Family recipes made with local masa and farm vegetables from the market.',2019,[]),
  V('two-creeks','Two Creeks Farm','Produce','Carpinteria',{sky:'#DDE5C0',aw:'#5E8C55',p:['#4B2E5C','#E8833A','#6E8B3D']},'PRODUCE',['downtown','carpinteria','montecito'],{downtown:16,carpinteria:2,montecito:7},['cash','card','ebt','tokens'],
    [I('Japanese eggplant','$3.50 / lb','plenty'),I('Carrots','$3 / bunch','plenty'),I('Hass avocados','$2 each','low'),I('Broccoli','$3 / lb','sold')],
    'Mixed vegetables and avocados from a small family farm on Carpinteria Creek.',2011,
    [{s:5,t:'Always something new each week.',w:'Lena P.'}])
];
// This week's attendance: vendorId -> marketId -> [status, updated]
var SEED_ATT = {
  'sunny-slope':{downtown:['here','8:15 AM'],carpinteria:['here','2:05 PM']},
  'mesa-hen':{downtown:['here','7:52 AM'],montecito:['here','7:40 AM']},
  'hilltop':{downtown:['not','Fri 6:10 PM'],goleta:['here','9:20 AM']},
  'rincon':{downtown:['here','8:02 AM'],carpinteria:['unc','']},
  'ellwood':{downtown:['here','7:45 AM'],goleta:['here','9:30 AM']},
  'topa':{downtown:['here','8:20 AM'],montecito:['not','Thu 5:00 PM']},
  'high-valley':{downtown:['unc',''],goleta:['here','9:15 AM']},
  'mission-tamales':{downtown:['not','Fri 8:30 PM'],carpinteria:['here','2:15 PM']},
  'two-creeks':{downtown:['here','7:58 AM'],carpinteria:['here','2:10 PM'],montecito:['here','7:35 AM']}
};

/* ---------- State ---------- */
var KEY='inseason-demo-v2';
function fresh(){return {vendors:JSON.parse(JSON.stringify(SEED_VENDORS)),att:JSON.parse(JSON.stringify(SEED_ATT)),follows:[],account:null,simple:false,alerts:false,demoClock:true,market:'downtown'};}
var S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.vendors) S=fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var UI={route:{name:'welcome'},stack:[],q:'',cat:'All',ebt:false,booth:null,pending:null,me:'sunny-slope',stockDraft:null};

/* ---------- Time ---------- */
function now(){
  if(!S.demoClock) return new Date();
  var d=new Date(); d.setDate(d.getDate()+((6-d.getDay()+7)%7)); d.setHours(9,30,0,0); return d; // this Saturday 9:30 AM
}
function mins(h){return h[0]*60+h[1];}
function fmtT(h){var hr=h[0]%12||12;return hr+':'+(h[1]<10?'0':'')+h[1]+' '+(h[0]<12?'AM':'PM');}
function hours(m){return fmtT(m.open)+' – '+fmtT(m.close);}
function isToday(m){return now().getDay()===m.day;}
function isOpen(m){var n=now(),t=n.getHours()*60+n.getMinutes();return isToday(m)&&t>=mins(m.open)&&t<mins(m.close);}
function nextOpen(m){var n=now(),d=new Date(n);d.setHours(0,0,0,0);var t=n.getHours()*60+n.getMinutes();
  for(var i=0;i<8;i++){var x=new Date(d);x.setDate(d.getDate()+i);if(x.getDay()===m.day&&!(i===0&&t>=mins(m.close)))return {d:x,i:i};}}
function marketLine(m){
  if(isOpen(m)) return '<span class="open">Open now</span> · until '+fmtT(m.close);
  var o=nextOpen(m),lab=o.i===0?'Today':o.i===1?'Tomorrow':o.d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  return '<span class="next">Next: '+lab+', '+hours(m)+'</span>';
}
function nowLabel(){var n=now();var h=n.getHours(),mm=n.getMinutes();return (h%12||12)+':'+(mm<10?'0':'')+mm+' '+(h<12?'AM':'PM');}
function nextDates(v,count){
  var out=[],d=new Date(now());d.setHours(0,0,0,0);
  for(var i=0;i<28&&out.length<count;i++){
    var day=new Date(d);day.setDate(d.getDate()+i);
    v.markets.forEach(function(mid){var m=mk(mid);if(m.day===day.getDay())out.push({date:day,m:m,first:i<7});});
  }
  return out.slice(0,count);
}

/* ---------- Helpers ---------- */
function mk(id){return MARKETS.filter(function(m){return m.id===id})[0];}
function vd(id){return S.vendors.filter(function(v){return v.id===id})[0];}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
function att(v,mid){var a=(S.att[v.id]||{})[mid];return a?{s:a[0],u:a[1]}:{s:'unc',u:''};}
function statusPill(v,m){
  var a=att(v,m.id),n0=now(),today=isToday(m)&&(n0.getHours()*60+n0.getMinutes())<mins(m.close),day=DAYS[m.day];
  if(a.s==='here') return '<span class="pill st-here">'+(today?'Here today':'Coming '+day)+'</span>';
  if(a.s==='not') return '<span class="pill st-not">'+(today?'Not here today':'Not coming '+day)+'</span>';
  return '<span class="pill st-unc">Not confirmed</span>';
}
function updated(v,m){var a=att(v,m.id);return a.u?'<span class="tiny muted">Updated '+esc(a.u)+'</span>':'<span class="tiny muted">No update yet</span>';}
var STOCK={plenty:['s-plenty','Plenty left'],low:['s-low','Running low'],sold:['s-sold','Sold out']};
function stockPill(s){return '<span class="stock '+STOCK[s][0]+'">'+STOCK[s][1]+'</span>';}
function itemRow(it,showPrice){
  return '<div class="item"><span class="'+(it.stock==='sold'?'strike':'')+'">'+esc(it.name)+(showPrice?' <span class="muted small">· '+esc(it.price)+'</span>':'')+'</span>'+stockPill(it.stock)+'</div>';
}
function cashOnly(v){return v.pay.length===1&&v.pay[0]==='cash';}
function payRow(v){
  if(cashOnly(v)) return '<div class="pay"><span class="paytag cashonly">Cash only</span></div>';
  return '<div class="pay">'+v.pay.map(function(p){return '<span class="paytag'+(p==='ebt'?' ebt':'')+'">'+PAY[p]+'</span>';}).join('')+'</div>';
}
function initials(n){return n.split(/\s+/).filter(function(w){return /^[A-Z]/.test(w)}).slice(0,2).map(function(w){return w[0]}).join('');}
function avatar(v,size){size=size||42;return '<span class="avatar" style="width:'+size+'px;height:'+size+'px;background:'+v.col.aw+'">'+initials(v.name)+'</span>';}
function following(v){return S.follows.indexOf(v.id)>-1;}
function followBtn(v,full){var on=following(v);return '<button class="btn follow'+(on?' on':'')+'" data-a="follow" data-id="'+v.id+'" aria-pressed="'+on+'"'+(full?' style="flex:1"':'')+'>'+(on?'Following':'Follow')+'</button>';}
function stall(v,h){
  var c=v.col,p=c.p;
  return '<svg class="photo" width="100%" height="'+h+'" viewBox="0 0 358 190" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Photo of the '+esc(v.name)+' stand" style="display:block">'+
  '<rect width="358" height="190" fill="'+c.sky+'"/><rect y="150" width="358" height="40" fill="#B5CC94"/>'+
  '<rect x="64" y="58" width="6" height="104" fill="#7E4F2D"/><rect x="288" y="58" width="6" height="104" fill="#7E4F2D"/>'+
  [0,1,2,3,4,5].map(function(i){return '<rect x="'+(50+i*43)+'" y="40" width="43" height="28" fill="'+(i%2?'#FBF6EC':c.aw)+'"/>'}).join('')+
  '<rect x="56" y="122" width="246" height="36" rx="3" fill="#A0693F"/>'+
  [110,180,250].map(function(x,i){return '<ellipse cx="'+x+'" cy="120" rx="34" ry="10" fill="#7E4F2D"/><circle cx="'+(x-12)+'" cy="110" r="10" fill="'+p[i]+'"/><circle cx="'+(x+6)+'" cy="108" r="10" fill="'+p[i]+'"/><circle cx="'+(x-3)+'" cy="99" r="10" fill="'+p[i]+'"/>'}).join('')+
  '<rect x="134" y="132" width="90" height="20" rx="3" fill="#FBF6EC"/><text x="179" y="146" text-anchor="middle" font-family="Fraunces,serif" font-size="11" font-weight="700" fill="#22402A">'+esc(v.sign)+'</text></svg>';
}
var IC={
  pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  search:'<circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>',
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  map:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  store:'<path d="M3 9l2-5h14l2 5"/><path d="M4 9v11h16V9"/><path d="M3 9h18"/>',
  back:'<polyline points="15 5 8 12 15 19"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  nav:'<polygon points="3 11 21 3 13 21 11 13 3 11"/>'
};
function ic(n,s,col,fill){return '<svg width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="'+(fill||'none')+'" stroke="'+(col||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';}
function toast(msg){var l=document.getElementById('layer');var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;l.appendChild(t);setTimeout(function(){t.remove()},2600);}

/* ---------- Navigation ---------- */
function go(name,params,replace){if(!replace)UI.stack.push(UI.route);UI.route={name:name,p:params||{}};render(true);}
function back(){UI.route=UI.stack.pop()||{name:'market'};render(true);}

function vMarkets(){
  return top('Pick a market',true)+'<div class="pad" style="display:flex;flex-direction:column;gap:12px;padding-top:6px">'+
  '<p class="muted small" style="margin:0">Near 93101 · Santa Barbara Certified Farmers Markets</p>'+

    '<div class="row" style="justify-content:space-between"><span class="b" style="font-size:17px">'+m.name+'</span>'+(S.market===m.id?'<span class="pill st-here">Selected</span>':'')+'</div>'+
    '<div class="small">'+DAYS[m.day]+' · '+hours(m)+'</div><div class="small muted">'+m.where+'</div>'+
    '<div class="small" style="margin-top:4px">'+marketLine(m)+' · '+count+' vendors coming</div></button>';
  }).join('')+'<p class="tiny muted" style="margin:0">Market days and hours from the Santa Barbara Certified Farmers Market schedule. Vendor info is sample data.</p></div>';

function top(title,withBack){
  return '<div class="top"><div class="row" style="justify-content:space-between">'+(withBack?'<button class="back" data-a="back">'+ic('back',22)+'Back</button>':'<span class="brand">InSeason</span>')+
  (title?'<span class="b" style="flex:1;text-align:center;margin-right:'+(withBack?'56px':'0')+'">'+title+'</span>':'')+'</div></div>';
}
function marketVendors(m){return S.vendors.filter(function(v){return v.markets.indexOf(m.id)>-1;});}
var ORDER={here:0,unc:1,not:2};
function sortV(list,m){return list.slice().sort(function(a,b){return ORDER[att(a,m.id).s]-ORDER[att(b,m.id).s];});}
function vMarket(){
  var m=mk(S.market);
  return '<div class="top"><div class="row" style="justify-content:space-between"><span class="brand">InSeason</span><span class="tiny muted">'+(S.account?esc(S.account):'Browsing as guest')+'</span></div>'+
  '<button class="mkt" data-a="markets">'+ic('pin',20,'#2F5D3A')+'<span style="flex:1;min-width:0"><span class="b" style="display:block">'+m.name+' Market</span><span class="small" style="display:block">'+marketLine(m)+'</span></span><span class="small b" style="color:var(--green)">Change</span></button>'+
  '<div class="search">'+ic('search',20,'#6B5B4B')+'<input id="q" type="text" enterkeyhint="search" placeholder="Search eggs, eggplant, a vendor…" value="'+esc(UI.q)+'" aria-label="Search by product or vendor" autocomplete="off">'+(UI.q?'<button class="clear" data-a="clear-q">Clear</button>':'')+'</div></div>'+
  '<div id="feed">'+feedBody()+'</div>'+tabs('market');
}
function feedBody(){
  var m=mk(S.market);
  if(UI.q.trim()) return searchResults(m);
  var h='';
  // Favorites
  h+='<div class="row pad" style="justify-content:space-between;margin-top:12px"><span class="sec-title">Your favorites</span>'+(S.follows.length?'<span class="small muted">'+S.follows.length+' followed</span>':'')+'</div>';
  var favs=S.follows.map(vd).filter(Boolean);
  if(!favs.length) h+='<div class="empty">Tap <b>Follow</b> on a vendor to keep them here at the top.</div>';
  else h+='<div class="favs">'+favs.map(function(v){return favCard(v,m)}).join('')+'</div>';
  // In season
  h+='<div class="pad" style="margin-top:6px"><span class="sec-title">In season now</span> <span class="small muted">· November</span></div>';
  h+='<div class="chips" style="padding-top:8px">'+SEASON.map(function(s){return '<button class="season" data-a="season" data-q="'+s.q+'"><span class="dot" style="background:'+s.c+'22;border-color:'+s.c+'"><span style="width:26px;height:26px;border-radius:50%;background:'+s.c+'"></span></span>'+s.label+'</button>'}).join('')+'</div>';
  // Filters
  h+='<div class="chips" style="margin-top:4px">'+CATS.map(function(c){return '<button class="chip'+(UI.cat===c?' on':'')+'" data-a="cat" data-c="'+c+'" aria-pressed="'+(UI.cat===c)+'">'+c+'</button>'}).join('')+'</div>';
  h+='<div class="chips" style="padding-top:0"><button class="chip ebt'+(UI.ebt?' on':'')+'" data-a="ebt" aria-pressed="'+UI.ebt+'">Takes EBT/CalFresh</button></div>';
  var list=sortV(marketVendors(m),m).filter(function(v){
    if(UI.cat!=='All'&&v.cat!==UI.cat) return false;
    if(UI.ebt&&v.pay.indexOf('ebt')<0) return false; return true;});
  var here=list.filter(function(v){return att(v,m.id).s==='here'}).length;
  h+='<div class="pad small muted" style="margin:2px 0 8px">'+here+' of '+list.length+' vendors '+(isToday(m)?'here today':'coming '+DAYS[m.day])+'</div>';
  if(!list.length) h+='<div class="empty">No vendors match. Try another filter.</div>';
  h+=S.simple?'<div class="simple pad" style="display:flex;flex-direction:column;gap:10px">'+list.map(function(v){return simpleRow(v,m)}).join('')+'</div>'
             :'<div class="pad" style="display:flex;flex-direction:column;gap:14px">'+list.map(function(v){return vendorCard(v,m)}).join('')+'</div>';
  return h;
}
function favCard(v,m){
  var a=att(v,m.id),note='';
  if(v.markets.indexOf(m.id)<0||a.s!=='here'){
    var alt=v.markets.filter(function(x){return x!==m.id&&att(v,x).s==='here'}).map(mk)[0];
    if(alt) note='<div class="tiny b" style="color:var(--green);margin-top:6px">At '+alt.short+' on '+DAYS[alt.day]+' instead</div>';
  }
  var pill=v.markets.indexOf(m.id)>-1?statusPill(v,m):'<span class="pill st-not">Not at this market</span>';
  return '<button class="fav" data-a="vendor" data-id="'+v.id+'"><div class="row">'+avatar(v,34)+'<span class="small b" style="line-height:1.2">'+esc(v.name)+'</span></div><div style="margin-top:8px">'+pill+'</div>'+note+'</button>';
}
function vendorCard(v,m){
  var a=att(v,m.id),away=a.s==='not';
  var items=v.items.filter(function(i){return i.on}).slice(0,3);
  return '<article class="card'+(away?' away':'')+'" aria-label="'+esc(v.name)+'">'+
  '<div class="row" style="padding:12px 12px 10px">'+avatar(v)+
  '<button class="card-hit" data-a="vendor" data-id="'+v.id+'" style="flex:1;min-width:0"><span class="b" style="display:block;font-size:16px">'+esc(v.name)+'</span><span class="tiny muted">'+esc(v.from)+' · Booth '+v.booth[m.id]+'</span></button>'+followBtn(v)+'</div>'+
  '<div class="row" style="padding:0 12px 10px;flex-wrap:wrap">'+statusPill(v,m)+updated(v,m)+'</div>'+
  '<button class="card-hit" data-a="vendor" data-id="'+v.id+'">'+stall(v,away?110:170)+'</button>'+
  '<div style="padding:12px;display:flex;flex-direction:column;gap:10px">'+
  (away?'<div class="small muted">Usually sells: '+items.map(function(i){return esc(i.name)}).join(', ')+'</div>':'<div class="items">'+items.map(function(i){return itemRow(i,true)}).join('')+'</div>')+
  payRow(v)+
  '<div class="row"><button class="btn" data-a="booth" data-id="'+v.id+'" style="flex:1">'+ic('map',18)+' Find booth</button><button class="btn ghost" data-a="vendor" data-id="'+v.id+'" style="flex:1">View vendor</button></div>'+
  '</div></article>';
}
function simpleRow(v,m){
  var a=att(v,m.id),items=v.items.filter(function(i){return i.on}).slice(0,3);
  return '<button class="srow'+(a.s==='not'?' away':'')+'" data-a="vendor" data-id="'+v.id+'"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><span class="b" style="font-size:19px">'+esc(v.name)+'</span>'+statusPill(v,m)+'</div>'+
  (a.s==='not'?'':'<div class="items" style="margin-top:10px">'+items.map(function(i){return itemRow(i,false)}).join('')+'</div>')+
  '<div style="margin-top:10px">'+payRow(v)+'</div></button>';
}
function searchResults(m){
  var q=UI.q.trim().toLowerCase();
  var res=[];
  sortV(marketVendors(m),m).forEach(function(v){
    var nameHit=v.name.toLowerCase().indexOf(q)>-1;
    var its=v.items.filter(function(i){return i.on&&i.name.toLowerCase().indexOf(q)>-1});
    if(nameHit||its.length) res.push({v:v,its:nameHit&&!its.length?v.items.filter(function(i){return i.on}):its});
  });
  var h='<div class="pad" style="margin:14px 0 10px"><span class="sec-title">'+res.length+' result'+(res.length===1?'':'s')+' for “'+esc(UI.q.trim())+'”</span><div class="small muted">at '+m.name+(isToday(m)?' today':' on '+DAYS[m.day])+'</div></div>';
  if(!res.length) h+='<div class="empty">No vendor at this market has that'+(isToday(m)?' today':' this week')+'. You may want to grab it at the grocery store.</div>';
  h+='<div class="pad" style="display:flex;flex-direction:column;gap:10px">'+res.map(function(r){
    var v=r.v,a=att(v,m.id);
    return '<button class="box" data-a="vendor" data-id="'+v.id+'" style="text-align:left;display:flex;flex-direction:column;gap:10px'+(a.s==='not'?';background:#F6F1E6':'')+'"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><span class="row">'+avatar(v,34)+'<span class="b">'+esc(v.name)+'</span></span>'+statusPill(v,m)+'</div>'+
    '<div class="items">'+r.its.map(function(i){return itemRow(i,true)}).join('')+'</div>'+payRow(v)+'</button>';
  }).join('')+'</div>';
  return h;
}
function vVendor(){
  var v=vd(UI.route.p.id),m=mk(S.market);
  var atM=v.markets.indexOf(m.id)>-1;
  var mm=atM?m:mk(v.markets[0]);
  var items=v.items.filter(function(i){return i.on});
  var dates=nextDates(v,5);
  return top('',true)+
  '<div style="position:relative">'+stall(v,190)+'</div>'+
  '<div class="pad" style="display:flex;flex-direction:column;gap:14px;margin-top:-30px;position:relative">'+
  '<div class="row" style="align-items:flex-end;gap:12px"><span style="border:4px solid var(--cream);border-radius:50%">'+avatar(v,68)+'</span></div>'+
  '<div><h1 style="font-size:28px">'+esc(v.name)+'</h1><div class="small muted">'+esc(v.cat)+' · '+esc(v.from)+' · At markets since '+v.since+'</div></div>'+
  '<div class="row" style="flex-wrap:wrap">'+statusPill(v,mm)+updated(v,mm)+'<span class="tiny muted">· '+mm.short+', booth '+v.booth[mm.id]+'</span></div>'+
  '<div class="row">'+followBtn(v,true)+'<button class="btn" style="flex:1" data-a="booth" data-id="'+v.id+'">'+ic('map',18)+' Find booth</button></div>'+
  '<button class="btn ghost" data-a="soon" data-msg="Holding items is coming soon. You\'ll be able to ask a vendor to set something aside for an hour.">Hold an item <span class="soon">Coming soon</span></button>'+
  '<section class="box"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="font-size:19px">What\'s left'+(isToday(mm)?' today':'')+'</h2>'+updated(v,mm)+'</div><div class="items" style="gap:10px">'+items.map(function(i){return itemRow(i,true)}).join('')+'</div></section>'+
  '<section class="box"><h2 style="font-size:19px;margin-bottom:10px">How to pay</h2>'+(cashOnly(v)?'<p style="margin:0 0 10px" class="small"><span class="paytag cashonly">Cash only</span> Bring cash. This vendor doesn\'t take cards.</p>':'')+
  '<div style="display:flex;flex-direction:column;gap:8px">'+Object.keys(PAY).map(function(p){var yes=v.pay.indexOf(p)>-1;return '<div class="item"><span>'+PAY[p]+'</span><span class="b small" style="color:'+(yes?'var(--green)':'var(--out-ink)')+'">'+(yes?'✓ Yes':'No')+'</span></div>'}).join('')+'</div></section>'+
  '<section class="box"><h2 style="font-size:19px;margin-bottom:10px">Upcoming dates</h2><div style="display:flex;flex-direction:column;gap:10px">'+dates.map(function(d){
     var a=att(v,d.m.id);var lab=d.first?(a.s==='here'?'<span class="pill st-here">Confirmed</span>':a.s==='not'?'<span class="pill st-not">Not coming</span>':'<span class="pill st-unc">Not confirmed</span>'):'<span class="tiny muted">Usual schedule</span>';
     return '<div class="item"><span><span class="b">'+d.date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+'</span> · '+d.m.short+'</span>'+lab+'</div>'}).join('')+'</div></section>'+
  '<section class="box"><h2 style="font-size:19px;margin-bottom:8px">About the farm</h2><p style="margin:0;line-height:1.5">'+esc(v.about)+'</p><p class="small muted" style="margin:8px 0 0">'+ic('pin',14)+' '+esc(v.from)+', CA</p></section>'+
  '<section><h2 style="font-size:19px;margin-bottom:8px">Photos</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">'+[0,1,2].map(function(){return '<div style="aspect-ratio:1;border-radius:10px;background:#EFE6D3;border:1.5px dashed #C9B896;display:flex;align-items:center;justify-content:center" class="tiny muted">Photo</div>'}).join('')+'</div></section>'+
  '<section class="box"><h2 style="font-size:19px;margin-bottom:10px">What shoppers say</h2>'+(v.reviews.length?v.reviews.map(function(r){return '<div style="margin-bottom:10px"><div style="color:var(--gold)">'+'★★★★★'.slice(0,r.s)+'</div><div>“'+esc(r.t)+'”</div><div class="tiny muted">'+esc(r.w)+'</div></div>'}).join(''):'<p class="small muted" style="margin:0 0 10px">No reviews shared yet.</p>')+
  '<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:10px"><span class="small">Add your own photo and review</span><span class="soon">Coming soon</span></div></section>'+
  '</div>'+tabs('market');
}
function vMap(){
  var m=mk(S.market),list=marketVendors(m),sel=UI.booth?vd(UI.booth):null;
  var byBooth={};list.forEach(function(v){byBooth[v.booth[m.id]]=v});
  var cells='';
  for(var n=1;n<=24;n++){
    var row=n<=12?0:1,col=(n-1)%12,x=14+col*29,y=row?172:58;

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a');if(!a)return;
  var id=el.getAttribute('data-id');
  switch(a){
    case 'back':back();break;
    case 'markets':go('markets');break;
    case 'pick-market':S.market=id;save();UI.stack=[];UI.q='';UI.booth=null;go('market',null,true);break;
    case 'vendor':go('vendor',{id:id});break;
    case 'follow':e.stopPropagation();if(!S.account&&!following(vd(id))){UI.pending=id;signupSheet();}else{toggleFollow(id);render();}break;
    case 'booth':UI.booth=id;go('map');break;
    case 'map-pick':UI.booth=id;render();break;
    case 'season':UI.q=el.getAttribute('data-q');render(true);break;
    case 'clear-q':UI.q='';render();break;
    case 'cat':UI.cat=el.getAttribute('data-c');render();break;
    case 'ebt':UI.ebt=!UI.ebt;render();break;
    case 'tab-market':UI.stack=[];UI.route={name:'market'};render(true);break;
    case 'tab-map':UI.stack=[];UI.booth=null;UI.route={name:'map'};render(true);break;
    case 'tab-favs':UI.stack=[];UI.route={name:'favs'};render(true);break;
    case 'tab-settings':UI.stack=[];UI.route={name:'settings'};render(true);break;
    case 'simple':S.simple=!S.simple;save();render();break;
    case 'alerts':S.alerts=!S.alerts;save();render();toast(S.alerts?'Alerts are coming soon. We saved your choice.':'Alerts off');break;
    case 'clock':S.demoClock=!S.demoClock;save();render();toast(S.demoClock?'Demo time: Saturday 9:30 AM':'Using the real time');break;
    case 'signup':signupSheet();break;
    case 'signout':S.account=null;S.follows=[];save();render();toast('Signed out');break;
    case 'reset':S=fresh();save();UI.stack=[];UI.q='';UI.route={name:'welcome'};render(true);toast('Demo data reset');break;
    case 'close-sheet':if(e.target===el){closeSheet();UI.pending=null;}break;
    case 'su-quick':finishSignup(el.getAttribute('data-who'));break;
    case 'soon':toast(el.getAttribute('data-msg'));break;
    // vendor side
    case 'vendor-home':UI.stack=[];UI.route={name:'vendor-home'};render(true);break;
    case 'shopper':UI.stack=[];UI.route={name:'market'};render(true);break;
    case 'checkin':var mid=el.getAttribute('data-m');S.att[UI.me]=S.att[UI.me]||{};S.att[UI.me][mid]=[el.getAttribute('data-s'),nowLabel()];save();render();toast(el.getAttribute('data-s')==='here'?'Shoppers can see you\'re coming.':'Got it. Shoppers will see you\'re not coming.');break;
    case 'v-stock':UI.stockDraft=null;go('v-stock');break;
    case 'v-seg':UI.stockDraft[+el.getAttribute('data-i')]=el.getAttribute('data-s');render();break;
    case 'v-allsold':UI.stockDraft=UI.stockDraft.map(function(){return 'sold'});render();break;
    case 'v-save':var v=me();v.items.forEach(function(it,i){it.stock=UI.stockDraft[i]});v.markets.forEach(function(mid){var a=S.att[v.id][mid];if(a&&a[0]==='here')a[1]=nowLabel();});save();UI.stockDraft=null;back();toast('Saved. Shoppers see it now.');break;
    case 'v-items':go('v-items');break;
    case 'v-itemtog':var it=me().items[+el.getAttribute('data-i')];it.on=!it.on;save();render();break;
    case 'v-additem':var inp=document.getElementById('newitem');var n=inp.value.trim();if(n){me().items.push(I(n,'Set price','plenty'));save();render();toast('Added '+n);}break;
    case 'v-schedule':go('v-schedule');break;
    case 'v-mtog':var vv=me(),m2=el.getAttribute('data-m'),k=vv.markets.indexOf(m2);
      if(k>-1){if(vv.markets.length>1)vv.markets.splice(k,1);else{toast('Keep at least one market.');break;}}
      else{vv.markets.push(m2);var used={};S.vendors.forEach(function(o){if(o.booth[m2])used[o.booth[m2]]=1});var b=1;while(used[b])b++;vv.booth[m2]=b;}
      save();render();break;
    case 'v-profile':go('v-profile');break;
    case 'v-paytog':var p=el.getAttribute('data-p'),pv=me(),pi=pv.pay.indexOf(p);if(pi>-1){if(pv.pay.length>1)pv.pay.splice(pi,1);}else pv.pay.push(p);save();render();break;
    case 'v-saveprofile':var pv2=me();pv2.name=document.getElementById('pf-name').value.trim()||pv2.name;pv2.about=document.getElementById('pf-about').value.trim();pv2.from=document.getElementById('pf-from').value.trim()||pv2.from;save();back();toast('Profile saved');break;
    case 'v-photo':go('v-photo');break;
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.querySelector('.scrim')){closeSheet();UI.pending=null;}});

render(true);
})();
